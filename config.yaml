profiles: [유튜브1, 유튜브2, 유튜브3]
comment:
  min_chars: 40
  max_chars: 120
  brand: 운명원
  disclosure: "[광고]"
brand:
  facts:                # 운명원에 대해 쓸 수 있는 사실 문장만(D4 기본값 한 줄)
    - 운명원은 연애 사주 상담을 하는 곳이다
validator:
  # 규칙 검사(6단계)에 더할 표현. 예: - {code: V10, pattern: "기가 막히게"}  (code는 V8·V9·V10)
  extra_patterns: []
limits:
  daily_max_comments: 10
discover:
  query: 연애 고민
  max_results: 12
  exclude_shorts: true    # 검색 결과에서 쇼츠(61초 미만·길이 없음)를 뺀다. 화면 01 「쇼츠 제외」의 기본값
rising:
  query: 연애
  min_views: 1000
  max_views: 5000
  min_views_per_hour: 150
transcript:
  provider: manual        # manual | unofficial
browser:
  default_target: sandbox # sandbox | assist
  headless: false         # 창 없이 돌릴지(자동 테스트는 true). 창이 보이면 아래 위치에 뜬다
  window_position: "60,-1060"   # 크롬 창 위치 x,y(2번 모니터). 모니터 배치에 맞게 바꾼다
  typing_delay_ms: [60, 160]    # 테스트 페이지에서 글자마다 기다리는 밀리초(최소, 최대)
  # chrome_path: ""       # 비우면 설치된 크롬을 찾는다. 프로필 폴더는 %LOCALAPPDATA%\JGMarketingAgent\profiles
llm:
  active: ollama          # 아래 providers에서 고른 이름(DESIGN 5.2.1). 옛 키 provider: ollama도 읽는다
  timeout_seconds: 180    # 답 하나를 기다리는 시간. 큰 모델은 첫 응답에 몇 분 걸릴 수 있다
  num_ctx: 8192           # 모델 입력 길이(토큰)
  keep_alive: "30m"       # 답한 뒤 모델을 메모리에 두는 시간
  context_chars: 6000     # 모델에 넣을 영상 자료 길이 한도(3단계)
  providers:
    ollama: {type: ollama}   # 주소·모델은 .env의 OLLAMA_BASE_URL, OLLAMA_MODEL
    # 12단계에서 다른 종류를 더한다. 키는 값이 아니라 환경 변수 이름만 적는다(값은 .env).
    # 예: openai: {type: openai_compatible, base_url: "...", model: "...", api_key_env: OPENAI_API_KEY}
