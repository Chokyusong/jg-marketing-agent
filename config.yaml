# 기본값이다. 사용자는 프로그램의 설정 화면에서 바꾸고, 바꾼 값은 %LOCALAPPDATA%\JGMarketingAgent\settings.json에
# 저장된다(이 파일은 그대로). 유튜브 API 키도 설정 화면에서 넣는다(암호화해 같은 폴더에).
profiles: [유튜브1, 유튜브2, 유튜브3]
comment:
  min_chars: 40
  max_chars: 120
  brand: 운명원
  disclosure: "[광고]"
  disclose_default: true  # 광고 표기 기본값(켬). ②칸 「광고 표기 붙이기」의 처음 상태(모든 영상)
brand:
  facts:               # 운명원에 대해 쓸 수 있는 사실 문장만(D4 기본값 한 줄)
    - 운명원은 연애 사주를 잘 봐주는 곳으로 유명하다   # 과제 원문의 운명원 소개(2026-11-17)
validator:
  # 규칙 검사(6단계)에 더할 표현. 예: - {code: V10, pattern: "기가 막히게"}  (code는 V8·V9·V10)
  extra_patterns: []
limits:
  daily_max_comments: 10
posting:
  confirm_before_post: false  # 게시 직전에 한 번 더 확인(기본 끔: [댓글 달기] 한 번으로 게시까지)
discover:
  query: 연애 고민
  max_results: 12
  exclude_shorts: true    # 검색 결과에서 쇼츠(아래 길이 미만·길이 없음)를 뺀다. ①칸 「쇼츠 빼기」의 기본값
  shorts_under_seconds: 181  # 이보다 짧은 영상을 쇼츠로 본다(유튜브 쇼츠는 3분까지)
rising:                 # 뜨기 직전 영상(①칸 [뜨기 직전 영상], 초안까지만). 올린 지 34시간 안의 영상에서 고른다
  query: 연애
  min_views: 1000
  max_views: 5000
  min_views_per_hour: 150
transcript:
  provider: auto          # auto(자막 자동으로 읽기, 못 읽으면 제목·설명) | manual(직접 넣은 자막만)
  timeout_seconds: 10     # 자막을 읽어 오는 데 기다리는 시간(넘으면 「자막 없음」으로 넘어간다)
browser:
  default_target: youtube # youtube(실제 게시, 기본) | sandbox(연습 모드)
  headless: false         # 창 없이 돌릴지(자동 테스트는 true)
  # 크롬 창을 띄울 화면: 비우면 자동(권장) — 작업을 시작할 때마다 지금 모니터를 읽어 프로그램 창이
  # 없는 모니터(하나뿐이면 그 왼쪽)에 작업 영역에 맞는 크기로 띄운다(app/browser/placement.py).
  # 설정 화면 「크롬 창 띄울 화면」에서 모니터를 고를 수 있다. 좌표(window_position)는 쓰지 않는다
  # (예전 판이 저장한 좌표가 남아 있으면 그대로 읽어 준다)
  typing_delay_ms: [60, 160]    # 글자마다 기다리는 밀리초(최소, 최대). 설정 화면의 「글자 입력 속도」
  # chrome_path: ""       # 비우면 설치된 크롬을 찾는다. 프로필 폴더는 %LOCALAPPDATA%\JGMarketingAgent\profiles
llm:
  active: ollama          # 아래 providers에서 고른 이름(DESIGN 5.2.1). 옛 키 provider: ollama도 읽는다
  timeout_seconds: 180    # 답 하나를 기다리는 시간
  cold_timeout_seconds: 420  # 모델이 아직 메모리에 없을 때(처음 불러올 때) 그 요청만 기다리는 시간
  warmup_on_start: true   # 프로그램을 켤 때 모델을 미리 불러 둔다(백그라운드, 실패해도 조용히)
  num_ctx: 8192           # 모델 입력 길이(토큰)
  keep_alive: "30m"       # 답한 뒤 모델을 메모리에 두는 시간
  context_chars: 6000     # 모델에 넣을 영상 자료 길이 한도(3단계)
  # R5: 설정 화면의 「AI」에서 고르는 목록. 비밀값은 없다 — 키는 프로그램 설정(사용자 폴더에 암호화)
  # > .env의 api_key_env 이름(개발용) 순서로 읽는다. 주소는 각 회사 문서로 확인한 것(app/llm/*.py 머리말).
  # models: 「모델」 고르는 목록의 추천 목록(2026-11-17). 그 AI의 모델 목록을 받아 오지 못할 때(키 없음·
  # 연결 실패)와 목록을 주지 않는 프로그램에서 보인다. **공식 문서로 확인한 이름만** 적는다(확인한 날짜와
  # 출처는 항목 옆 주석). 확인하지 못한 AI는 비워 둔다 — 화면에는 「직접 입력…」이 늘 있다.
  # 코드에는 모델 이름을 박지 않는다.
  providers:
    ollama: {type: ollama, label: Ollama}   # 주소·모델은 .env의 OLLAMA_BASE_URL, OLLAMA_MODEL
    openai:
      type: openai_compatible
      label: ChatGPT(OpenAI)
      sends_to: OpenAI
      base_url: "https://api.openai.com/v1"
      api_key_env: OPENAI_API_KEY
      json_mode: true
      max_tokens_field: max_completion_tokens
      # 2026-11-17 developers.openai.com/api/docs/models 「Flagship models」의 Model ID
      models: [gpt-6-astra, gpt-6.1-sol, gpt-6.1-terra, gpt-6-luna]
    claude:
      type: anthropic
      label: Claude(Anthropic)
      sends_to: Anthropic
      base_url: "https://api.anthropic.com"
      api_key_env: ANTHROPIC_API_KEY
      # 2026-11-17 claude-api 스킬(Anthropic 공식 모델 ID 목록)
      models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5, claude-fable-5-2]
    gemini:
      type: openai_compatible
      label: Gemini(Google)
      sends_to: Google
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      api_key_env: GEMINI_API_KEY
      json_mode: false
      max_tokens_field: ""
      # 2026-11-17 ai.google.dev/gemini-api/docs/models(→ aistudio.google.com/docs/models)의 「Stable」만
      models: [gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite]
    grok:
      type: openai_compatible
      label: Grok(xAI)
      sends_to: xAI
      base_url: "https://api.x.ai/v1"
      api_key_env: XAI_API_KEY
      json_mode: true
      max_tokens_field: max_completion_tokens
      # 2026-11-17 docs.x.ai/docs/models 표의 글 모델(추론 전용·에이전트용 변형은 뺐다)
      models: [grok-4.7, grok-4.6, grok-4.5, grok-4.3]
    custom:
      type: openai_compatible
      label: 직접 입력
      sends_to: 입력한 주소
      base_url: ""
      editable_url: true
      key_optional: true
      api_key_env: CUSTOM_LLM_API_KEY
      json_mode: false
      max_tokens_field: max_tokens
      models: []              # 사람이 넣는 주소라 추천할 이름이 없다
    # 로그인된 프로그램: 맨 위 「기본값 (그 프로그램이 정한 모델)」이 기본.
    # Codex는 그 프로그램에게 목록을 받아 온다(`codex debug models`의 visibility: list, 2026-11-17).
    # 문서의 `codex -m` 예시 이름(gpt-6-*)은 ChatGPT 계정에서 model_not_found가 나서 뺐다 — 추천
    # 목록은 비워 두고, 받아 오지 못하면 「기본값」·「직접 입력…」만 보인다.
    # Claude Code는 목록 명령이 없어(`claude --help`, 2026-11-17) --model 별칭(fable·opus·sonnet)과
    # claude-api 스킬의 전체 이름
    codex-cli:
      type: cli
      label: Codex
      program: codex
      sends_to: "OpenAI(Codex)"
      models: []
    claude-cli:
      type: cli
      label: Claude Code
      program: claude
      sends_to: "Anthropic(Claude Code)"
      models: [fable, opus, sonnet, claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
    gemini-cli: {type: cli, label: Gemini 프로그램, program: gemini, sends_to: "Google(Gemini 프로그램)"}  # 화면에 「CLI」를 쓰지 않는다
