<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>연습 페이지 — {{ title }}</title>
  <link rel="stylesheet" href="/static/css/sandbox.css" />
  <script type="module" src="/static/js/sandbox.js"></script>
</head>
<!-- 통제된 테스트 페이지(DESIGN 6.1). 이 앱이 주는 자체 화면이며 실제 유튜브가 아니다. -->
<body data-video="{{ video_id }}" data-profile="{{ profile }}" data-fail="{{ fail }}">
  <p class="banner" role="note">연습 페이지 — 실제 유튜브가 아닙니다 <span>JG 마케팅 에이전트 · 연습 모드</span></p>
  <main class="wrap">
    <h1 id="video-title">{{ title }}</h1>
    <p class="meta">영상 ID {{ video_id }}{% if profile %} · 프로필 {{ profile }}{% endif %}{% if fail %} · 실패 스위치 {{ fail }}{% endif %}</p>
    <div class="screen" aria-label="영상 자리">영상 자리 · 재생하지 않습니다</div>

    <section class="comments" aria-label="댓글">
      <h2>댓글 <span id="comment-count">0</span></h2>
      <form id="comment-form" autocomplete="off">
        <label class="sr-only" for="comment-input">댓글</label>
        <textarea id="comment-input" rows="2" maxlength="1000" spellcheck="false" placeholder="댓글 추가..."></textarea>
        <div class="actions">
          <span class="status" id="post-status" role="status" aria-live="polite"></span>
          <button type="button" id="comment-cancel" class="ghost">취소</button>
          {% if fail != "hide_button" %}<button type="submit" id="comment-submit" disabled>댓글</button>{% endif %}
        </div>
      </form>
      <ol class="list" id="comment-list" aria-live="polite"></ol>
    </section>
  </main>
</body>
</html>
